<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icons/favicon.ico">
    <title>🐻熊熊Land - online</title>
    <style>
        /* ----- 基础重置 & 全局变量 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
            text-decoration: none;
        }
        body {
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
            font-family: "幼圆", "Comic Sans MS", monospace; /* 默认幼圆，像素主题单独覆盖 */
        }
        .page-layout {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-start;
        }
.theme-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #444;
    text-align: center;
    width: 100%;
    border-bottom: 1px solid #ccc;
    padding-bottom: 5px;
}
        .theme-switcher {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 120px;
            margin-top: 20px;
        }
        .model-settings-btn {
            padding: 10px 8px;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            background-color: #4fc3f7;
            transition: all 0.2s ease;
        }
        .model-settings-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .model-settings-panel {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 12px;
            background: #fff;
            border: 3px solid #ff9eaa;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }
        .model-settings-panel.show {
            display: block;
        }
        .model-settings-panel label {
            font-size: 12px;
            color: #555;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }
        .model-settings-panel select,
        .model-settings-panel input {
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 13px;
            font-family: inherit;
        }
        .model-settings-note {
            font-size: 12px;
            color: #777;
        }
        .theme-btn {
            padding: 12px 8px;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            width: 100%;
        }
        .theme-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        /* 当前激活主题按钮的样式 */
.theme-btn.active {
    position: relative;               /* 为伪元素定位 */
    animation: pulse 1.5s infinite;   /* 同时添加动画 */
    padding-left: 36px; /* 为图标留出空间 */
}

.theme-btn.active::before {
    content: "☞";                     /* 符号 */
    position: absolute;
    left: 18px;                         /* 距离左侧距离 */
    top: 50%;
    transform: translateY(-50%);       /* 垂直居中 */
    font-size: 20px;
    font-weight: bold;
    color: #fff;                       /* 黑色对勾，更通用 */
    text-shadow: 0 0 2px #000;         /* 白色发光，适应深色背景 */
            font-family: "幼圆", sans-serif;
    /* 如需白色对勾，改为 color:#fff; text-shadow:0 0 2px #000; */
}
@keyframes pulse {
    0% {
        transform: scale(1);
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    50% {
        transform: scale(1.02);               /* 轻微放大 */
        box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }
    100% {
        transform: scale(1);
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
}

        .container {
            flex: 1;
            padding: 30px;
            border-radius: 16px;
        }
        .nav {
            justify-content: center;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .nav li a {
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .nav li a:hover {
            transform: translateY(-2px);
        }
        .title-with-images {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .side-gif {
            width: 80px;
            border-radius: 50%;
        }
        h1 {
            font-size: 36px;
            margin: 20px 0;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            margin: 15px 0;
            text-align: justify;
        }
        .responsive-img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin: 20px 0;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        audio {
            border-radius: 16px;
            margin: 15px 0;
            border: 3px solid #ff9eaa;
        }

        /* ----- 移动端基础适配 ----- */
        @media (max-width: 768px) {
            .page-layout {
                flex-direction: column;
                gap: 15px;
                max-width: 100%;
                padding: 10px;
            }
            .theme-switcher {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                margin-top: 0;
            }
            .model-settings-btn {
                width: auto;
            }
            .model-settings-panel {
                width: 100%;
            }
            .theme-btn {
                padding: 10px 15px;
                font-size: 12px;
                width: auto;
            }
            .theme-btn.active::before {
                left: 12px;
            }
            .container {
                max-width: 100%;
                margin: 0 auto;
                padding: 20px;
                border-width: 3px !important;
            }
            h1 {
                font-size: 28px;
            }
            .nav {
                flex-direction: column;
                gap: 8px;
                padding: 8px;
            }
            .nav li a {
                padding: 5px;
                font-size: 14px;
                text-align: center;
            }
            .side-gif {
                width: 50px;
            }
            .title-with-images {
                gap: 15px;
            }
        }
        @media (min-width: 601px) and (max-width: 768px) {
            .nav {
                flex-direction: row;
            }
        }

        /* ----- 像素主题专用字体 ----- */
        @font-face {
            font-family: "Minecraft AE";
            src: url("fonts/Minecraft AE(ch).ttf") format("truetype");
        }

        /* ========== 主题样式 ========== */

            box-shadow: 0 0 0 8px rgba(255,158,170,0.1);
        }
        .theme-original h1 {
            color: #ff6b8b;
            text-shadow: 2px 2px 0 #ffe0e7;
        }
        .theme-original .nav {
            background-color: #87ceeb;
            border: 3px solid #4fc3f7;
        }
        .theme-original .nav li a {
            background-color: #4fc3f7;
        }
        .theme-original .nav li a:hover { background-color: #2196f3; }
        .theme-original .nav li a.active { background-color: #ff6b8b; }
        .theme-original .back-btn {
            background-color: #ff6b8b; /* 使用h1颜色或主题主色 */
        }

        /* ---- 糖果缤纷风 ---- */
        body.theme-candy {

            color: #555;

        }
        .theme-candy .container {
            background: linear-gradient(145deg,#fff 0,#fff9fb 100%);
            border: 5px solid #ff85a2;
            border-radius: 24px;
            box-shadow: 0 0 0 10px rgba(255,133,162,0.1), 0 8px 24px rgba(0,0,0,0.08);
        }
        .theme-candy h1 {
            background: linear-gradient(90deg,#ff6b8b,#ff99cc,#87cefa);

            background: linear-gradient(145deg,#66c2ff,#4fc3f7);

            border: 2px solid transparent;
        }
        .theme-candy .nav li a:hover {
            background: linear-gradient(145deg,#4fc3f7,#2196f3);

            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border-color: #fff;
        }
        .theme-candy .nav li a.active {
            background: linear-gradient(145deg,#ff6b8b,#ff85a2);

        .theme-candy .side-gif {
            border: 4px solid #ffdd55;

        .theme-candy .responsive-img {
            border-radius: 20px;

            box-shadow: 0 10px 20px rgba(135,206,250,0.2);
        }
        .theme-candy audio {
            border-radius: 50px;
            border: 3px solid #ff85a2;
            background: linear-gradient(145deg,#fff0f5,#ffe6ef);
        }

        .theme-forest .responsive-img { border: 5px solid #8fbc8f; }
        .theme-forest audio {
            border: 3px solid #c19a6b;
            background-color: #f8f5f0;
        }
        
        /*----- 以上三种主题的按钮修正 -----*/
        .theme-original .nav li a {
            box-shadow: 0 4px 0 #d45e7a; /* 深粉色阴影，模拟立体按压效果 */
        }
        .theme-original .back-btn {
            box-shadow: 0 4px 0 #d45e7a;
        }
        .theme-original .nav li a:hover,
        .theme-original .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #d45e7a; /* hover时阴影更高，配合上移 */
        }
        .theme-forest .nav li a,
        .theme-forest .back-btn {
            border: 2px solid #4f7317; /* 深绿色边框，与文字颜色呼应 */
        }
        /* 普通状态添加半透明白色边框 */
        .theme-candy .nav li a,
        .theme-candy .back-btn {
            border-color: rgba(255, 255, 255, 0.3);
        }
        /* hover时边框变为纯白（保留原有渐变背景和缩放效果） */
        .theme-candy .nav li a:hover,
        .theme-candy .back-btn:hover {
            border-color: #fff;
        }

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnOriginal = document.getElementById('btn-original');
            const btnCandy = document.getElementById('btn-candy');
            const btnForest = document.getElementById('btn-forest');
            const btnPixel = document.getElementById('btn-pixel');
            const body = document.body;
            const allBtns = [btnOriginal, btnCandy, btnForest, btnPixel];

            // 从 localStorage 读取保存的主题，若没有则默认 'theme-original'
            const savedTheme = localStorage.getItem('selectedTheme') || 'theme-original';
            body.className = savedTheme;

            // 根据当前 body 类名设置对应按钮为 active
            function setActiveButtonFromBodyClass() {
                allBtns.forEach(btn => {
                    btn.classList.remove('active');
                });
                if (body.classList.contains('theme-original')) {
                    btnOriginal.classList.add('active');
                } else if (body.classList.contains('theme-candy')) {
                    btnCandy.classList.add('active');
                } else if (body.classList.contains('theme-forest')) {
                    btnForest.classList.add('active');
                } else if (body.classList.contains('theme-pixel')) {
                    btnPixel.classList.add('active');
                }
            }

            // 初始化按钮激活状态
            setActiveButtonFromBodyClass();

            // 保存主题到 localStorage 的函数
            function saveTheme(themeClass) {
                localStorage.setItem('selectedTheme', themeClass);
            }

            // 为每个按钮绑定点击事件，切换主题并保存
            btnOriginal.addEventListener('click', function() {
                body.className = 'theme-original';
                setActiveButtonFromBodyClass();
                saveTheme('theme-original');
            });
            btnCandy.addEventListener('click', function() {
                body.className = 'theme-candy';
                setActiveButtonFromBodyClass();
                saveTheme('theme-candy');
            });
            btnForest.addEventListener('click', function() {
                body.className = 'theme-forest';
                setActiveButtonFromBodyClass();
                saveTheme('theme-forest');
            });
            btnPixel.addEventListener('click', function() {
                body.className = 'theme-pixel';
                setActiveButtonFromBodyClass();
                saveTheme('theme-pixel');
            });

            const chatWidget = document.getElementById('chatWidget');
            const chatHeader = document.getElementById('chatHeader');
            const chatMessages = document.getElementById('chatMessages');
            const chatForm = document.getElementById('chatForm');
            const chatInput = document.getElementById('chatInput');
            const modelSettingsBtn = document.getElementById('modelSettingsBtn');
            const modelSettingsPanel = document.getElementById('modelSettingsPanel');
            const chatProvider = document.getElementById('chatProvider');
            const chatModel = document.getElementById('chatModel');
            const chatBaseUrl = document.getElementById('chatBaseUrl');
            const chatApiKey = document.getElementById('chatApiKey');

            const providerConfigs = {
                longcat: {
                    baseUrl: 'https://api.longcat.chat/openai',
                    models: ['LongCat-Flash-Chat']
                },
                modelscope: {
                    baseUrl: 'https://api-inference.modelscope.cn/v1',
                    models: ['Qwen/Qwen2.5-7B-Instruct']
                }
            };

            const savedProvider = localStorage.getItem('chatProvider') || 'longcat';
            const savedModel = localStorage.getItem('chatModel') || '';
            const savedApiKey = localStorage.getItem('chatApiKey') || '';

            chatProvider.value = savedProvider;
            chatApiKey.value = savedApiKey;

            function renderModels(provider, preferred) {
                const config = providerConfigs[provider];
                chatModel.innerHTML = '';
                config.models.forEach(modelName => {
                    const option = document.createElement('option');
                    option.value = modelName;
                    option.textContent = modelName;
                    chatModel.appendChild(option);
                });
                const match = config.models.includes(preferred) ? preferred : config.models[0];
                chatModel.value = match;
            }

            function syncProviderSettings(provider, preferredModel) {
                const config = providerConfigs[provider];
                chatBaseUrl.value = config.baseUrl;
                renderModels(provider, preferredModel);
            }

            function saveChatConfig() {
                localStorage.setItem('chatProvider', chatProvider.value);
                localStorage.setItem('chatModel', chatModel.value);
                localStorage.setItem('chatApiKey', chatApiKey.value.trim());
            }

            modelSettingsBtn.addEventListener('click', function() {
                modelSettingsPanel.classList.toggle('show');
            });

            chatProvider.addEventListener('change', function() {
                syncProviderSettings(chatProvider.value, '');
                saveChatConfig();
            });

            chatModel.addEventListener('change', saveChatConfig);
            chatApiKey.addEventListener('input', saveChatConfig);

            syncProviderSettings(chatProvider.value, savedModel);

            const systemPrompt = '你是熊熊助手，负责介绍熊熊Land网站功能并提供子页面链接。' +
                '当被问到网站功能时，说明有首页、相册、影集、地图、BNU和更多等页面，' +
                '并给出这些页面的链接。也允许用户自由提问并简短回答。';

            const conversation = [
                { role: 'system', content: systemPrompt }
            ];

            function appendMessage(role, content, isHtml) {
                const msg = document.createElement('div');
                msg.className = 'chat-msg ' + role;
                if (isHtml) {
                    msg.innerHTML = content;
                } else {
                    msg.textContent = content;
                }
                chatMessages.appendChild(msg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            appendMessage('assistant', '你好！我是熊熊助手。这里有这些入口：' +
                '<a href="index.html">首页</a>、' +
                '<a href="gallery.html">相册</a>、' +
                '<a href="videos.html">影集</a>、' +
                '<a href="maptest.html">地图</a>、' +
                '<a href="BNU/BNUindex.html">BNU</a>、' +
                '<a href="more/more_index.html">更多</a>。' +
                '也可以随便问我问题。', true);

            chatForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                const userText = chatInput.value.trim();
                if (!userText) {
                    return;
                }

                appendMessage('user', userText, false);
                chatInput.value = '';

                conversation.push({ role: 'user', content: userText });

            const baseUrl = chatBaseUrl.value.trim();
            const model = chatModel.value.trim();
            const apiKey = chatApiKey.value.trim();

                if (!baseUrl || !model || !apiKey) {
                    appendMessage('assistant', '请先填写 API Base URL、模型和 API Key。', false);
                    return;
                }

                try {
                    const response = await fetch(baseUrl + '/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + apiKey
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: conversation,
                            temperature: 0.7,
                            max_tokens: 500
                        })
                    });

                    if (!response.ok) {
                        throw new Error('请求失败：' + response.status);
                    }

                    const data = await response.json();
                    const reply = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;

                    if (!reply) {
                        appendMessage('assistant', '没有收到有效回复。', false);
                        return;
                    }

                    conversation.push({ role: 'assistant', content: reply });
                    appendMessage('assistant', reply, false);
                } catch (error) {
                    appendMessage('assistant', '请求出错，请检查配置或网络。', false);
                }
            });

            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            if (!isMobile) {
                let isDragging = false;
                let offsetX = 0;
                let offsetY = 0;

                chatHeader.addEventListener('mousedown', function(event) {
                    isDragging = true;
                    const rect = chatWidget.getBoundingClientRect();
                    offsetX = event.clientX - rect.left;
                    offsetY = event.clientY - rect.top;
                    chatWidget.style.right = 'auto';
                    chatWidget.style.bottom = 'auto';
                });

                document.addEventListener('mousemove', function(event) {
                    if (!isDragging) {
                        return;
                    }
                    chatWidget.style.left = (event.clientX - offsetX) + 'px';
                    chatWidget.style.top = (event.clientY - offsetY) + 'px';
                });

                document.addEventListener('mouseup', function() {
                    isDragging = false;
                });
            }
        });
    </script>
